<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feedback Comment Generator</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --ink:#241f18;
    --paper:#efe9da;
    --paper-2:#e4dcc8;
    --line:#c7ba99;
    --line-soft:#dcd2ba;
    --accent:#9a3b2e;
    --accent-2:#3a5a40;
    --accent-2-soft:#e7efe7;
    --gold:#b08d3a;
    --sidebar-bg:#fbf8f0;
    --shadow:rgba(40,30,15,.18);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    background:
      radial-gradient(circle at 15% -5%, #fefcf6, transparent 45%),
      radial-gradient(circle at 95% 5%, #f6efdd, transparent 40%),
      radial-gradient(circle at 50% 120%, #e2d8c0, transparent 55%),
      linear-gradient(160deg, #f3eddd 0%, var(--paper) 55%, #e9e1cd 100%);
    background-attachment:fixed;
    color:var(--ink);
    line-height:1.5;
    min-height:100vh;
  }
  header{
    border-bottom:3px double var(--line);
    padding:26px 34px 20px;
    display:flex;justify-content:space-between;align-items:flex-end;
    flex-wrap:wrap;gap:14px;
    background:linear-gradient(180deg,rgba(255,255,255,.4),transparent);
  }
  header h1{
    font-size:30px;font-weight:700;letter-spacing:.5px;
    line-height:1.05;
  }
  header h1 small{
    display:block;font-size:13px;font-weight:400;letter-spacing:3px;
    text-transform:uppercase;color:var(--accent);margin-top:6px;
  }
  .status{
    font-size:12px;letter-spacing:1px;text-transform:uppercase;
    padding:6px 12px;border:1px solid var(--line);border-radius:2px;
    background:var(--paper-2);
  }
  .status.ok{color:var(--accent-2);border-color:var(--accent-2)}
  .status.err{color:var(--accent);border-color:var(--accent)}
  main{display:flex;min-height:calc(100vh - 100px)}
  /* sidebar */
  #sidebar{
    width:280px;flex-shrink:0;border-right:1px solid var(--line);
    padding:0;background:var(--sidebar-bg);
    box-shadow:1px 0 0 rgba(255,255,255,.6) inset;
    display:flex;flex-direction:column;
    position:sticky;top:0;align-self:flex-start;
    max-height:100vh;
  }
  .sidebar-inner{
    padding:22px 16px;display:flex;flex-direction:column;
    min-height:0;flex:1;
  }
  #sidebar h2{
    font-size:12px;text-transform:uppercase;letter-spacing:2px;
    color:var(--accent);margin-bottom:12px;
    display:flex;align-items:center;justify-content:space-between;gap:8px;
  }
  #sidebar h2 .cat-total{
    font-size:11px;letter-spacing:.5px;color:#8a7e62;text-transform:none;
    background:var(--paper-2);border:1px solid var(--line);
    border-radius:10px;padding:1px 8px;font-weight:400;
  }
  .cat-search-wrap{position:relative;margin-bottom:6px}
  .cat-search-wrap .clear-cat{
    position:absolute;right:8px;top:50%;transform:translateY(-50%);
    border:none;background:none;cursor:pointer;color:#a8966a;font-size:15px;
    display:none;line-height:1;padding:2px;
  }
  .cat-search-wrap .clear-cat:hover{color:var(--accent)}
  .cat-search-wrap.has-text .clear-cat{display:block}
  #catList{
    overflow-y:auto;margin:8px -4px 0;padding:0 4px;flex:1;min-height:0;
  }
  #catList::-webkit-scrollbar{width:8px}
  #catList::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
  .cat-btn{
    display:flex;justify-content:space-between;align-items:center;gap:8px;
    width:100%;text-align:left;border:1px solid transparent;background:transparent;
    font-family:inherit;font-size:15.5px;color:var(--ink);cursor:pointer;
    padding:10px 12px;border-radius:6px;margin-bottom:4px;transition:.13s;
    border-left:3px solid transparent;line-height:1.25;
  }
  .cat-btn span:first-child{flex:1;overflow-wrap:anywhere}
  .cat-btn:hover{background:#fff;border-color:var(--line-soft)}
  .cat-btn.active{
    background:#fff;border-color:var(--accent);
    border-left:3px solid var(--accent);font-weight:700;
    box-shadow:0 1px 4px rgba(154,59,46,.15);
  }
  .cat-btn .count{
    font-size:11px;background:var(--paper-2);border:1px solid var(--line);
    border-radius:10px;padding:1px 8px;color:#6b5f48;flex-shrink:0;font-weight:400;
  }
  .cat-btn.active .count{background:var(--accent);color:#fff;border-color:var(--accent)}
  .side-actions{margin-top:14px;padding-top:14px;border-top:1px solid var(--line-soft);display:flex;flex-direction:column;gap:8px}
  /* content */
  #content{flex:1;padding:24px 30px;overflow-y:auto}
  .toolbar{
    display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:20px;
  }
  .toolbar input[type=text]{
    flex:1;min-width:200px;font-family:inherit;font-size:15px;
    padding:10px 14px;border:1px solid var(--line);border-radius:3px;
    background:#fffdf7;color:var(--ink);
  }
  button.btn{
    font-family:inherit;font-size:14px;cursor:pointer;
    padding:9px 16px;border-radius:3px;border:1px solid var(--ink);
    background:var(--ink);color:var(--paper);transition:.15s;letter-spacing:.3px;
  }
  button.btn:hover{background:#000}
  button.btn.ghost{background:transparent;color:var(--ink)}
  button.btn.ghost:hover{background:var(--paper-2)}
  button.btn.accent{background:var(--accent);border-color:var(--accent)}
  button.btn.accent:hover{filter:brightness(1.08)}
  button.btn.small{padding:5px 11px;font-size:12px}
  /* tray */
  #tray{
    border:1px solid var(--gold);border-radius:6px;
    background:linear-gradient(180deg,#fffaec,#fff7e0);
    padding:14px 16px;margin-bottom:22px;
    position:sticky;top:12px;z-index:20;
    box-shadow:0 4px 14px rgba(176,141,58,.18);
  }
  #tray h3{
    font-size:12px;text-transform:uppercase;letter-spacing:2px;color:var(--gold);
    margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;
  }
  #trayItems{font-size:14.5px;min-height:20px;color:#4a4030;max-height:160px;overflow-y:auto}
  #trayItems .empty{color:#a8966a;font-style:italic}
  .tray-line{
    padding:6px 0 6px 22px;border-bottom:1px dotted var(--line);position:relative;
  }
  .tray-line:before{content:"›";position:absolute;left:6px;color:var(--gold);font-weight:700}
  .tray-line:last-child{border-bottom:none}
  .tray-line .rm{
    position:absolute;right:0;top:6px;cursor:pointer;color:#bfae84;font-size:13px;
    border:none;background:none;
  }
  .tray-line .rm:hover{color:var(--accent)}
  .tray-actions{margin-top:12px;display:flex;gap:10px;flex-wrap:wrap}
  /* ---- quick-select bar ---- */
  .quickjump{
    display:flex;flex-wrap:wrap;gap:9px;margin-bottom:18px;
    padding:14px 16px 14px;border:1px solid var(--accent-2);
    border-radius:8px;align-items:center;
    background:linear-gradient(180deg,#f1f6f1,#e9f1e9);
    box-shadow:0 2px 10px rgba(58,90,64,.1);
  }
  .quickjump .qj-label{
    font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;
    color:#fff;margin-right:6px;font-weight:700;
    background:var(--accent-2);padding:5px 11px;border-radius:14px;
    display:inline-flex;align-items:center;gap:6px;
  }
  .quickjump .qj-label:before{content:"✦";font-size:11px}
  .qj-pill{
    font-family:inherit;font-size:13.5px;cursor:pointer;
    padding:6px 13px 6px 7px;border-radius:20px;border:1px solid #b9cdba;
    background:#fff;color:#2f3a30;transition:.13s;
    display:inline-flex;align-items:center;gap:8px;
  }
  .qj-pill:hover{border-color:var(--accent-2);box-shadow:0 2px 6px rgba(58,90,64,.2);transform:translateY(-1px)}
  .qj-num{
    font-size:11px;font-weight:700;color:#fff;background:var(--accent-2);
    width:20px;height:20px;border-radius:50%;display:inline-flex;
    align-items:center;justify-content:center;flex-shrink:0;
  }
  .qj-pill .qj-count{
    font-size:10.5px;color:#7a8a7c;background:#eef4ee;
    border-radius:9px;padding:1px 7px;font-weight:700;
  }
  .qj-pill.has-sel{
    border-color:var(--gold);background:linear-gradient(180deg,#fffaec,#fff4d6);
    color:#5c4a1e;font-weight:700;box-shadow:0 2px 8px rgba(176,141,58,.28);
  }
  .qj-pill.has-sel .qj-num{background:var(--gold)}
  .qj-pill.has-sel .qj-count{background:var(--gold);color:#fff}

  /* ---- criterion grid ---- */
  .crit-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(330px,1fr));
    gap:16px;align-items:start;
  }
  /* ---- criterion panels ---- */
  .crit-panel{
    border:1px solid var(--line);border-radius:6px;
    background:linear-gradient(180deg,#fffdf7,#fbf7ec);
    box-shadow:0 1px 3px var(--shadow);overflow:hidden;
    scroll-margin-top:14px;
  }
  .crit-head{
    display:flex;align-items:center;gap:10px;cursor:pointer;
    padding:13px 15px;user-select:none;transition:.12s;
    border-left:4px solid var(--accent-2);
  }
  .crit-head:hover{background:rgba(58,90,64,.06)}
  .crit-head.has-sel{border-left-color:var(--gold)}
  .crit-chevron{
    font-size:11px;color:#8a7e62;transition:transform .2s;flex-shrink:0;width:12px;
  }
  .crit-panel.collapsed .crit-chevron{transform:rotate(-90deg)}
  .crit-idx{
    font-size:12px;font-weight:700;color:#fff;background:var(--accent-2);
    min-width:22px;height:22px;padding:0 5px;border-radius:11px;flex-shrink:0;
    display:inline-flex;align-items:center;justify-content:center;
  }
  .crit-head.has-sel .crit-idx{background:var(--gold)}
  .crit-title{
    flex:1;font-size:16px;font-weight:700;color:#2a241a;line-height:1.2;
  }
  .crit-tag{
    font-size:9px;letter-spacing:1.2px;text-transform:uppercase;
    color:var(--accent-2);font-weight:400;display:block;margin-bottom:2px;
  }
  .crit-stats{display:flex;gap:6px;flex-shrink:0;align-items:center}
  .chip{
    font-size:10.5px;padding:2px 9px;border-radius:11px;letter-spacing:.3px;
    border:1px solid var(--line);background:var(--paper);color:#6b5f48;white-space:nowrap;
  }
  .chip.sel{background:var(--gold);color:#fff;border-color:var(--gold);font-weight:700}
  .crit-body{padding:2px 12px 12px}
  .crit-panel.collapsed .crit-body{display:none}

  /* ---- comment cards ---- */
  .card{
    background:#fff;border:1px solid var(--line);border-radius:5px;
    padding:11px 13px;margin-top:8px;display:flex;gap:10px;
    align-items:flex-start;transition:.12s;cursor:pointer;position:relative;
  }
  .card:hover{border-color:var(--accent-2);box-shadow:0 2px 7px var(--shadow)}
  .card.selected{border-color:var(--gold);background:#fffaec;box-shadow:inset 3px 0 0 var(--gold)}
  .card .body{flex:1;font-size:14.5px;color:#2a241a;line-height:1.45}
  .card .meta{font-size:10.5px;color:#a89b80;margin-top:5px;letter-spacing:.4px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .badge{
    font-size:9px;letter-spacing:.6px;text-transform:uppercase;padding:1px 7px;
    border-radius:9px;font-weight:700;
  }
  .badge.shared{background:#e6efe7;color:var(--accent-2);border:1px solid #b9cdba}
  .badge.private{background:#f3e6e3;color:var(--accent);border:1px solid #d8b8b0}
  .badge.mine{background:var(--gold);color:#fff}
  .card .ctrls{
    display:flex;gap:4px;flex-shrink:0;opacity:0;transition:.12s;
  }
  .card:hover .ctrls{opacity:1}
  .pick{
    width:24px;height:24px;border-radius:50%;border:1.5px solid var(--gold);
    background:transparent;cursor:pointer;font-size:13px;color:var(--gold);
    display:flex;align-items:center;justify-content:center;transition:.12s;flex-shrink:0;
  }
  .card.selected .pick{background:var(--gold);color:#fff}
  .icon-btn{
    border:1px solid var(--line);background:var(--paper);cursor:pointer;font-size:11px;
    color:#8a7e62;padding:2px 7px;border-radius:3px;transition:.12s;
  }
  .icon-btn:hover{color:#fff;background:var(--accent);border-color:var(--accent)}
  .icon-btn.edit:hover{background:var(--accent-2);border-color:var(--accent-2)}
  .crit-actions{margin-top:6px;display:flex;justify-content:flex-end}
  .empty-state{text-align:center;padding:60px 20px;color:#9a8e72;font-style:italic}
  .expand-bar{display:flex;gap:10px;margin-bottom:14px}
  .expand-bar a{
    font-size:12px;color:var(--accent-2);cursor:pointer;text-decoration:underline;
    letter-spacing:.3px;
  }
  .expand-bar a:hover{color:var(--accent)}
  @media(max-width:1100px){.crit-grid{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}}
  /* modal */
  .overlay{
    position:fixed;inset:0;background:rgba(26,24,20,.55);
    display:none;align-items:center;justify-content:center;z-index:50;padding:20px;
  }
  .overlay.show{display:flex}
  .modal{
    background:var(--paper);border:1px solid var(--line);border-radius:6px;
    width:100%;max-width:520px;padding:26px;box-shadow:0 20px 60px rgba(0,0,0,.4);
  }
  .modal h3{font-size:22px;margin-bottom:18px;border-bottom:2px solid var(--line);padding-bottom:8px}
  .field{margin-bottom:16px}
  .field label{
    display:block;font-size:12px;text-transform:uppercase;letter-spacing:1px;
    color:var(--accent);margin-bottom:6px;
  }
  .field input,.field select,.field textarea{
    width:100%;font-family:inherit;font-size:15px;padding:10px 12px;
    border:1px solid var(--line);border-radius:3px;background:#fffdf7;color:var(--ink);
  }
  .field textarea{min-height:90px;resize:vertical}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:8px}
  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);
    background:var(--ink);color:var(--paper);padding:12px 22px;border-radius:4px;
    font-size:14px;letter-spacing:.3px;z-index:100;transition:.3s;opacity:0;
  }
  .toast.show{transform:translateX(-50%) translateY(0);opacity:1}
  .setup-note{
    margin:40px auto;max-width:680px;background:#fffdf7;border:1px solid var(--line);
    border-radius:6px;padding:30px;line-height:1.7;
  }
  .setup-note h3{color:var(--accent);margin-bottom:14px}
  .setup-note code,.setup-note pre{
    background:var(--paper-2);font-family:"SF Mono",Menlo,monospace;font-size:12.5px;
    border-radius:3px;
  }
  .setup-note code{padding:2px 6px}
  .setup-note pre{padding:14px;overflow-x:auto;margin:12px 0;white-space:pre-wrap}
  @media(max-width:760px){
    main{flex-direction:column}
    #sidebar{
      width:100%;border-right:none;border-bottom:1px solid var(--line);
      position:static;max-height:none;
    }
    #catList{max-height:300px}
  }
</style>
</head>
<body>

<header>
  <h1>The Editor's Desk<small>Feedback Comment Generator</small></h1>
  <div style="display:flex;align-items:center;gap:14px">
    <div id="userBox" style="display:none;text-align:right;font-size:13px;line-height:1.3">
      <div id="userName" style="font-weight:700"></div>
      <div id="userRole" style="font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--accent)"></div>
    </div>
    <button id="logoutBtn" class="btn ghost small" style="display:none" onclick="doLogout()">Sign out</button>
    <div id="statusBadge" class="status">connecting…</div>
  </div>
</header>

<main>
  <aside id="sidebar">
    <div class="sidebar-inner">
      <h2>Categories <span class="cat-total" id="catTotal"></span></h2>
      <div class="cat-search-wrap" id="catSearchWrap">
        <input type="text" id="catSearch" placeholder="🔍  Filter categories…" oninput="renderSidebar()"
          style="width:100%;font-family:inherit;font-size:13.5px;padding:8px 28px 8px 11px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink)">
        <button class="clear-cat" title="Clear" onclick="clearCatSearch()">✕</button>
      </div>
      <div id="catCount" style="font-size:11px;color:#8a7e62;min-height:14px;margin:2px 2px 0"></div>
      <div id="catList"></div>
      <div class="side-actions">
        <button class="btn ghost small" onclick="openCategoryModal()">+ New Category</button>
      </div>
    </div>
  </aside>

  <section id="content">
    <div id="appBody" style="display:none">
      <div id="tray">
        <h3>Selected Comments <span><button class="btn ghost small" onclick="clearTray()">Clear</button></span></h3>
        <div id="trayItems"><span class="empty">Nothing selected yet. Tap the ◦ on any comment to add it.</span></div>
        <div class="tray-actions">
          <button class="btn accent" onclick="copyTray()">⎘ Copy All</button>
          <span id="trayCount" style="align-self:center;font-size:13px;color:#8a7e62"></span>
        </div>
      </div>

      <div class="toolbar">
        <input type="text" id="search" placeholder="Search comments in this category…" oninput="render()">
        <select id="scopeFilter" onchange="render()" style="font-family:inherit;font-size:14px;padding:9px 12px;border:1px solid var(--line);border-radius:3px;background:#fffdf7;color:var(--ink)">
          <option value="all">All visible</option>
          <option value="shared">Shared only</option>
          <option value="mine">My comments only</option>
        </select>
        <button class="btn" onclick="openCommentModal()">+ Add Comment</button>
      </div>

      <div id="comments"></div>
    </div>

    <div id="setupNote" class="setup-note" style="display:none"></div>
  </section>
</main>

<!-- Comment modal -->
<div class="overlay" id="commentOverlay">
  <div class="modal">
    <h3 id="commentModalTitle">Add Comment</h3>
    <input type="hidden" id="commentId">
    <div class="field">
      <label>Criterion (the specific issue, e.g. "Missing caption")</label>
      <input type="text" id="commentCriterion" placeholder="e.g. Caption present but not referenced">
    </div>
    <div class="field">
      <label>Comment text</label>
      <textarea id="commentText" placeholder="Write the feedback the student will read…"></textarea>
    </div>
    <div class="field" id="sharedField">
      <label>Visibility</label>
      <select id="commentShared" onchange="updateSharedHint()">
        <option value="false">Private — only I can see and use this</option>
        <option value="true">Shared — visible to all teachers</option>
      </select>
      <div id="sharedHint" style="font-size:11.5px;color:#9a8e72;margin-top:5px;font-style:italic"></div>
    </div>
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeModal('commentOverlay')">Cancel</button>
      <button class="btn accent" onclick="saveComment()">Save</button>
    </div>
  </div>
</div>

<!-- Category modal -->
<div class="overlay" id="categoryOverlay">
  <div class="modal">
    <h3>New Category</h3>
    <div class="field">
      <label>Category name</label>
      <input type="text" id="categoryName" placeholder="e.g. Writing Quality, Figures, Tables…">
    </div>
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeModal('categoryOverlay')">Cancel</button>
      <button class="btn accent" onclick="saveCategory()">Create</button>
    </div>
  </div>
</div>

<!-- Login overlay -->
<div class="overlay" id="authOverlay" style="background:rgba(26,24,20,.92)">
  <div class="modal" style="max-width:420px">
    <h3 id="authTitle">Sign in</h3>
    <p style="font-size:13px;color:#6b5f48;margin:-8px 0 16px">Sign in to view shared comments and manage your own.</p>
    <div class="field" id="nameField" style="display:none">
      <label>Your name</label>
      <input type="text" id="authName" placeholder="e.g. Dr. Jane Smith">
    </div>
    <div class="field">
      <label>Email</label>
      <input type="email" id="authEmail" placeholder="you@university.edu" autocomplete="username">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="authPassword" placeholder="••••••••" autocomplete="current-password">
    </div>
    <div id="authError" style="color:var(--accent);font-size:13px;margin-bottom:12px;display:none"></div>
    <div class="modal-actions" style="justify-content:space-between;align-items:center">
      <a id="authToggle" style="font-size:13px;color:var(--accent-2);cursor:pointer;text-decoration:underline" onclick="toggleAuthMode()">New here? Create an account</a>
      <button class="btn accent" id="authSubmit" onclick="doAuth()">Sign in</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   1) PASTE YOUR SUPABASE CREDENTIALS HERE
   Find them in Supabase dashboard -> Project Settings -> API
   (or the "Connect" button -> App Frameworks)
   ============================================================ */
const SUPABASE_URL = "https://adzviszrcveeurrgmukl.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_uyLwXeGHHokx0TtEcBDJlQ_oJPI0-aB";
/* ============================================================ */

let db = null;
let categories = [];
let comments = [];
let activeCat = null;
let tray = []; // {id, text}
let collapsed = {}; // criterion name -> true if collapsed
let currentUser = null;   // supabase auth user
let myProfile = null;     // {id, role, full_name}
let authMode = "signin";  // or "signup"
const isAdmin = () => myProfile && myProfile.role === "admin";

const $ = id => document.getElementById(id);

function setStatus(text, cls){
  const b = $("statusBadge");
  b.textContent = text;
  b.className = "status " + (cls||"");
}

function toast(msg){
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._t);
  t._t = setTimeout(()=>t.classList.remove("show"), 2200);
}

function showSetupNote(){
  $("appBody").style.display = "none";
  const n = $("setupNote");
  n.style.display = "block";
  n.innerHTML = `
    <h3>One-time setup</h3>
    <p><strong>Step 1.</strong> Open this <code>index.html</code> in a text editor and paste your Supabase
    URL and publishable (anon) key near the top of the script section, where it says
    <code>YOUR-PROJECT-REF</code>. You'll find both in your Supabase dashboard under
    <em>Project Settings → API</em>. The anon/publishable key is safe to put in a public file.</p>
    <p><strong>Step 2.</strong> In the Supabase dashboard open the <em>SQL Editor</em>, paste the contents of
    the <code>schema.sql</code> file that came with this app, and run it once. That creates the
    <code>profiles</code>, <code>categories</code> and <code>comments</code> tables with role-based
    security (admin / teacher), private vs shared comments, and own-only editing.</p>
    <p><strong>Step 3.</strong> Reload this page, create an account with your email, then in the SQL Editor run
    <code>update profiles set role = 'admin' where email = 'you@example.com';</code> to make yourself the admin.</p>
    <p><strong>Step 4.</strong> Push the file to your GitHub repo and turn on GitHub Pages to share it with your teachers.</p>
  `;
}

async function init(){
  if(!SUPABASE_URL || SUPABASE_URL.includes("YOUR-PROJECT-REF") || SUPABASE_ANON_KEY.includes("YOUR-")){
    setStatus("not configured","err");
    showSetupNote();
    return;
  }
  try{
    db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  }catch(e){
    console.error(e); setStatus("connection error","err"); showSetupNote(); return;
  }
  // react to login / logout
  db.auth.onAuthStateChange((_event, session)=>{
    handleSession(session);
  });
  const { data } = await db.auth.getSession();
  handleSession(data.session);
}

let _sessionBusy = false;
async function handleSession(session){
  if(_sessionBusy) return;
  _sessionBusy = true;
  try{
    if(!session){
      currentUser = null; myProfile = null;
      showLogin();
      _sessionBusy = false;
      return;
    }
    currentUser = session.user;
    // fetch (or wait for) the profile row that the DB trigger creates
    myProfile = await fetchProfileWithRetry(currentUser.id);
    showApp();
    await loadAll();
    setStatus("connected","ok");
  }catch(e){
    console.error(e);
    setStatus("error","err");
  }
  _sessionBusy = false;
}

async function fetchProfileWithRetry(uid, tries=4){
  for(let i=0;i<tries;i++){
    const { data, error } = await db.from("profiles").select("*").eq("id", uid).maybeSingle();
    if(data) return data;
    if(error && i===tries-1) console.warn(error);
    await new Promise(r=>setTimeout(r, 400)); // give the trigger a moment on first signup
  }
  // fallback: assume teacher
  return { id: uid, role: "teacher", full_name: currentUser?.email };
}

function showLogin(){
  $("authOverlay").classList.add("show");
  $("appBody").style.display = "none";
  $("userBox").style.display = "none";
  $("logoutBtn").style.display = "none";
  setStatus("signed out","");
}

function showApp(){
  $("authOverlay").classList.remove("show");
  $("appBody").style.display = "block";
  $("setupNote").style.display = "none";
  $("userBox").style.display = "block";
  $("logoutBtn").style.display = "inline-block";
  $("userName").textContent = myProfile.full_name || currentUser.email;
  $("userRole").textContent = isAdmin() ? "Administrator" : "Teacher";
  // hide "New Category" for non-admins
  document.querySelectorAll(".side-actions").forEach(el=>{
    el.style.display = isAdmin() ? "flex" : "none";
  });
}

/* ---------- auth actions ---------- */
function toggleAuthMode(){
  authMode = authMode === "signin" ? "signup" : "signin";
  $("authTitle").textContent = authMode === "signup" ? "Create account" : "Sign in";
  $("authSubmit").textContent = authMode === "signup" ? "Create account" : "Sign in";
  $("authToggle").textContent = authMode === "signup" ? "Already have an account? Sign in" : "New here? Create an account";
  $("nameField").style.display = authMode === "signup" ? "block" : "none";
  $("authError").style.display = "none";
}

async function doAuth(){
  const email = $("authEmail").value.trim();
  const password = $("authPassword").value;
  const errBox = $("authError");
  errBox.style.display = "none";
  if(!email || !password){ showAuthError("Email and password are required."); return; }
  $("authSubmit").disabled = true;
  try{
    if(authMode === "signup"){
      const name = $("authName").value.trim();
      const { error } = await db.auth.signUp({
        email, password,
        options:{ data:{ full_name: name || email } }
      });
      if(error) throw error;
      toast("Account created — signing you in…");
    }else{
      const { error } = await db.auth.signInWithPassword({ email, password });
      if(error) throw error;
    }
  }catch(e){
    showAuthError(e.message || "Authentication failed.");
  }
  $("authSubmit").disabled = false;
}
function showAuthError(msg){
  const b = $("authError"); b.textContent = msg; b.style.display = "block";
}
async function doLogout(){
  await db.auth.signOut();
  currentUser = null; myProfile = null;
  comments = []; categories = []; tray = []; activeCat = null;
  showLogin();
}

async function loadAll(){
  const { data: cats, error: e1 } = await db.from("categories").select("*").order("name");
  if(e1) throw e1;
  categories = cats || [];
  // RLS already limits rows to shared + own (+ all if admin)
  const { data: cmts, error: e2 } = await db.from("comments").select("*").order("created_at");
  if(e2) throw e2;
  comments = cmts || [];
  if(!activeCat && categories.length) activeCat = categories[0].id;
  renderSidebar();
  render();
}

function renderSidebar(){
  const list = $("catList");
  const totalEl = $("catTotal");
  const countEl = $("catCount");
  const wrap = $("catSearchWrap");
  if(totalEl) totalEl.textContent = categories.length ? categories.length : "";
  if(!categories.length){
    list.innerHTML = `<p style="font-size:13px;color:#9a8e72;font-style:italic">No categories yet. Create one to begin.</p>`;
    if(countEl) countEl.textContent = "";
    return;
  }
  const term = ($("catSearch")?.value || "").trim().toLowerCase();
  if(wrap) wrap.classList.toggle("has-text", !!term);
  const visible = term ? categories.filter(c=>(c.name||"").toLowerCase().includes(term)) : categories;
  if(countEl) countEl.textContent = term ? `${visible.length} of ${categories.length} match` : "";
  if(!visible.length){
    list.innerHTML = `<p style="font-size:13px;color:#9a8e72;font-style:italic">No categories match “${esc(term)}”.</p>`;
    return;
  }
  list.innerHTML = visible.map(c=>{
    const n = comments.filter(x=>x.category_id===c.id).length;
    return `<button class="cat-btn ${c.id===activeCat?'active':''}" onclick="selectCat(${c.id})">
      <span>${highlight(c.name, term)}</span>
      <span class="count">${n}</span>
    </button>`;
  }).join("");
}

function highlight(name, term){
  const safe = esc(name);
  if(!term) return safe;
  const lower = (name||"").toLowerCase();
  const i = lower.indexOf(term);
  if(i<0) return safe;
  // map index onto escaped string by re-escaping each segment
  const before = esc(name.slice(0, i));
  const match  = esc(name.slice(i, i+term.length));
  const after  = esc(name.slice(i+term.length));
  return `${before}<mark style="background:var(--gold);color:#fff;border-radius:2px;padding:0 1px">${match}</mark>${after}`;
}

function clearCatSearch(){
  const el = $("catSearch");
  if(el){ el.value=""; el.focus(); }
  renderSidebar();
}

function selectCat(id){ activeCat = id; renderSidebar(); render(); $("search").value=""; }

function render(){
  if(!activeCat){
    $("comments").innerHTML = `<div class="empty-state">Select or create a category to see its comments.</div>`;
    return;
  }
  const term = $("search").value.trim().toLowerCase();
  const scope = $("scopeFilter") ? $("scopeFilter").value : "all";
  let list = comments.filter(c=>c.category_id===activeCat);
  if(scope==="shared") list = list.filter(c=>c.shared);
  if(scope==="mine") list = list.filter(c=>c.owner_id===currentUser?.id);
  if(term) list = list.filter(c=>(c.text||"").toLowerCase().includes(term)||(c.criterion||"").toLowerCase().includes(term));

  if(!list.length){
    const why = scope==="mine" ? "You haven't created any comments in this category yet."
              : scope==="shared" ? "No shared comments in this category yet."
              : (term?'No comments match your search.':'No comments in this category yet.');
    $("comments").innerHTML = `<div class="empty-state">${why}</div>`;
    return;
  }

  // group by criterion
  const groups = {};
  list.forEach(c=>{
    const k = (c.criterion||"").trim() || "General";
    (groups[k] = groups[k]||[]).push(c);
  });
  const keys = Object.keys(groups).sort((a,b)=>a.localeCompare(b));

  // when searching, auto-expand everything so results are visible
  const searching = !!term;

  // assign a serial number to each criterion (stable order)
  const idOf = k => "crit-" + k.replace(/[^a-z0-9]/gi,"_");

  // quick-select bar: serial number + name, click to select/unselect the whole criterion
  const quickjump = keys.length>1 ? `
    <div class="quickjump">
      <span class="qj-label">Quick Select</span>
      ${keys.map((k,i)=>{
        const items = groups[k];
        const selCount = items.filter(c=>tray.find(t=>t.id===c.id)).length;
        const allSel = selCount===items.length;
        return `<button class="qj-pill ${selCount?'has-sel':''}" title="${allSel?'Unselect':'Select'} all comments under “${escAttr(k)}”" onclick="selectGroup('${escAttr(k)}',${!allSel})">
          <span class="qj-num">${i+1}</span>${esc(k)}
          <span class="qj-count">${selCount?selCount+'/':''}${items.length}</span>
        </button>`;
      }).join("")}
    </div>` : "";

  const bar = keys.length>1 ? `
    <div class="expand-bar">
      <a onclick="setAllCollapsed(false)">Expand all</a>
      <a onclick="setAllCollapsed(true)">Collapse all</a>
    </div>` : "";

  const panels = keys.map((k,i)=>{
    const items = groups[k];
    const selCount = items.filter(c=>tray.find(t=>t.id===c.id)).length;
    const isCollapsed = searching ? false : !!collapsed[k];
    const allSelected = selCount===items.length;
    return `
    <div class="crit-panel ${isCollapsed?'collapsed':''}" id="${idOf(k)}">
      <div class="crit-head ${selCount?'has-sel':''}" onclick="toggleCollapse('${escAttr(k)}')">
        <span class="crit-chevron">▼</span>
        <span class="crit-idx">${i+1}</span>
        <span class="crit-title"><span class="crit-tag">Criterion</span>${esc(k)}</span>
        <span class="crit-stats">
          ${selCount?`<span class="chip sel">${selCount}</span>`:""}
          <span class="chip">${items.length}</span>
        </span>
      </div>
      <div class="crit-body">
        ${items.map(c=>{
          const sel = !!tray.find(t=>t.id===c.id);
          const mine = c.owner_id === currentUser?.id;
          const canEdit = mine || isAdmin();
          const badges = [
            c.shared ? `<span class="badge shared">Shared</span>` : `<span class="badge private">Private</span>`,
            mine ? `<span class="badge mine">Mine</span>` : ""
          ].join("");
          return `
          <div class="card ${sel?'selected':''}" onclick="cardClick(event,${c.id})">
            <button class="pick" title="Select" onclick="toggleTray(${c.id});event.stopPropagation()">${sel?'✓':'◦'}</button>
            <div class="body">
              ${esc(c.text)}
              <div class="meta">${badges}<span>${new Date(c.created_at).toLocaleDateString()}</span></div>
            </div>
            <div class="ctrls">
              ${canEdit ? `
              <button class="icon-btn edit" onclick="editComment(${c.id});event.stopPropagation()">Edit</button>
              <button class="icon-btn" onclick="deleteComment(${c.id});event.stopPropagation()">Delete</button>` : ``}
            </div>
          </div>`;
        }).join("")}
        <div class="crit-actions">
          <button class="btn ghost small" onclick="selectGroup('${escAttr(k)}',${!allSelected})">
            ${allSelected?'Unselect all':'Select all in this criterion'}
          </button>
        </div>
      </div>
    </div>`;
  }).join("");

  $("comments").innerHTML = quickjump + bar + `<div class="crit-grid">${panels}</div>`;
}

function jumpTo(k){
  if(collapsed[k]){ collapsed[k]=false; render(); }
  const el = document.getElementById("crit-" + k.replace(/[^a-z0-9]/gi,"_"));
  if(el){
    el.scrollIntoView({behavior:"smooth", block:"start"});
    el.style.transition = "box-shadow .3s";
    el.style.boxShadow = "0 0 0 3px var(--gold)";
    setTimeout(()=>{ el.style.boxShadow = ""; }, 900);
  }
}

function cardClick(e, id){
  // clicking anywhere on the card (except buttons) toggles selection
  toggleTray(id);
}

function toggleCollapse(k){
  collapsed[k] = !collapsed[k];
  render();
}
function setAllCollapsed(val){
  const term = $("search").value.trim().toLowerCase();
  let list = comments.filter(c=>c.category_id===activeCat);
  list.forEach(c=>{ collapsed[(c.criterion||"").trim()||"General"] = val; });
  render();
}
function selectGroup(k, add){
  const items = comments.filter(c=>c.category_id===activeCat && ((c.criterion||"").trim()||"General")===k);
  items.forEach(c=>{
    const i = tray.findIndex(t=>t.id===c.id);
    if(add && i<0) tray.push({id:c.id, text:c.text});
    if(!add && i>=0) tray.splice(i,1);
  });
  renderTray(); render();
}

/* ---- selection tray ---- */
function toggleTray(id){
  const c = comments.find(x=>x.id===id);
  if(!c) return;
  const i = tray.findIndex(t=>t.id===id);
  if(i>=0) tray.splice(i,1); else tray.push({id, text:c.text});
  renderTray(); render();
}
function renderTray(){
  const el = $("trayItems");
  if(!tray.length){
    el.innerHTML = `<span class="empty">Nothing selected yet. Click any comment card to add it here.</span>`;
  }else{
    el.innerHTML = tray.map(t=>`<div class="tray-line">${esc(t.text)}<button class="rm" title="Remove" onclick="toggleTray(${t.id})">✕</button></div>`).join("");
  }
  $("trayCount").textContent = tray.length ? `${tray.length} selected` : "";
}
function clearTray(){ tray=[]; renderTray(); render(); }
function copyTray(){
  if(!tray.length){ toast("Nothing to copy"); return; }
  const text = tray.map(t=>t.text).join("\n\n");
  navigator.clipboard.writeText(text).then(
    ()=>toast("Copied "+tray.length+" comment(s)"),
    ()=>toast("Copy failed — select the text manually")
  );
}

/* ---- comment CRUD ---- */
function openCommentModal(){
  if(!activeCat){ toast("Create a category first"); return; }
  $("commentModalTitle").textContent = "Add Comment";
  $("commentId").value = "";
  $("commentCriterion").value = "";
  $("commentText").value = "";
  // admins create shared comments by default; teachers create private
  $("commentShared").value = isAdmin() ? "true" : "false";
  updateSharedHint();
  $("commentOverlay").classList.add("show");
  $("commentCriterion").focus();
}
function editComment(id){
  const c = comments.find(x=>x.id===id);
  if(!c) return;
  if(!(c.owner_id===currentUser?.id || isAdmin())){ toast("You can only edit your own comments"); return; }
  $("commentModalTitle").textContent = "Edit Comment";
  $("commentId").value = c.id;
  $("commentCriterion").value = c.criterion||"";
  $("commentText").value = c.text||"";
  $("commentShared").value = c.shared ? "true" : "false";
  updateSharedHint();
  $("commentOverlay").classList.add("show");
}
function updateSharedHint(){
  const v = $("commentShared").value === "true";
  $("sharedHint").textContent = v
    ? "Every teacher will see and be able to use this comment."
    : "Only you will see this comment. You can make it shared later.";
}
async function saveComment(){
  const id = $("commentId").value;
  const criterion = $("commentCriterion").value.trim();
  const text = $("commentText").value.trim();
  const shared = $("commentShared").value === "true";
  if(!text){ toast("Comment text is required"); return; }
  try{
    if(id){
      const { error } = await db.from("comments").update({criterion, text, shared}).eq("id", id);
      if(error) throw error;
      toast("Comment updated");
    }else{
      // owner_id defaults to auth.uid() in the DB, but we set it explicitly too
      const { error } = await db.from("comments").insert({
        category_id:activeCat, criterion, text, shared, owner_id: currentUser.id
      });
      if(error) throw error;
      toast("Comment added");
    }
    closeModal("commentOverlay");
    await loadAll();
  }catch(e){ console.error(e); toast("Save failed: "+(e.message||e)); }
}
async function deleteComment(id){
  const c = comments.find(x=>x.id===id);
  if(c && !(c.owner_id===currentUser?.id || isAdmin())){ toast("You can only delete your own comments"); return; }
  if(!confirm("Delete this comment permanently?")) return;
  try{
    const { error } = await db.from("comments").delete().eq("id", id);
    if(error) throw error;
    tray = tray.filter(t=>t.id!==id);
    toast("Comment deleted");
    await loadAll(); renderTray();
  }catch(e){ console.error(e); toast("Delete failed: "+(e.message||e)); }
}

/* ---- category ---- */
function openCategoryModal(){
  $("categoryName").value="";
  $("categoryOverlay").classList.add("show");
  $("categoryName").focus();
}
async function saveCategory(){
  const name = $("categoryName").value.trim();
  if(!name){ toast("Name is required"); return; }
  try{
    const { data, error } = await db.from("categories").insert({name}).select();
    if(error) throw error;
    closeModal("categoryOverlay");
    if(data && data[0]) activeCat = data[0].id;
    toast("Category created");
    await loadAll();
  }catch(e){ console.error(e); toast("Failed: "+(e.message||e)); }
}

function closeModal(id){ $(id).classList.remove("show"); }
function esc(s){ return (s==null?"":String(s)).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function escAttr(s){ return (s==null?"":String(s)).replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }

// close modal on overlay click (but never the login overlay)
document.querySelectorAll(".overlay").forEach(o=>{
  if(o.id==="authOverlay") return;
  o.addEventListener("click",e=>{ if(e.target===o) o.classList.remove("show"); });
});

// Enter submits the login form
["authEmail","authPassword","authName"].forEach(id=>{
  const el = document.getElementById(id);
  if(el) el.addEventListener("keydown", e=>{ if(e.key==="Enter") doAuth(); });
});

init();
</script>
